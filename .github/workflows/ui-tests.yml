name: UI regression tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/search.test.cjs
      - name: Check deployed frontend matches source
        run: |
          cmp js/search.js deploy/js/search.js
          cmp js/channel.js deploy/js/channel.js
          cmp js/navigation.js deploy/js/navigation.js

